<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Writing — TOEFL</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
</head>
<body class="section-writing">
<div class="hero hero-filled">
  <div class="app-wide">
    <a href="../sections.html" class="back-btn" data-i18n="back_home">← Home</a>
    <div class="hero-top">
      <div class="hero-icon"><i class="ti ti-pencil" aria-hidden="true"></i></div>
      <h1 data-i18n="writing_section">Writing Section</h1>
    </div>
    <div class="hero-pills">
      <span class="hero-pill"><i class="ti ti-list-check" aria-hidden="true"></i>3 <span data-i18n="task_types">task types</span></span>
      <span class="hero-pill solid"><i class="ti ti-clock" aria-hidden="true"></i>~23 <span data-i18n="unit_min">min</span></span>
    </div>
  </div>
  <i class="ti ti-pencil hero-watermark" aria-hidden="true"></i>
</div>
<div class="app-wide">
  <div class="task-flow">

    <div class="task-row">
      <div class="task-rail" aria-hidden="true"><span class="line line-top"></span><span class="task-step">1</span><span class="line line-bot"></span></div>
      <div class="task-card" onclick="location.href='../writing/build-a-sentence/index.html'">
        <div class="task-icon"><i class="ti ti-puzzle" aria-hidden="true"></i></div>
        <div class="task-info">
          <div class="task-name" data-i18n="build_a_sentence">Build a Sentence</div>
          <div class="task-count" data-i18n="bas_short">16 questions</div>
        </div>
        <div class="task-time"><span class="num">6</span><span class="unit" data-i18n="unit_min">min</span></div>
      </div>
    </div>

    <div class="task-row">
      <div class="task-rail" aria-hidden="true"><span class="line line-top"></span><span class="task-step">2</span><span class="line line-bot"></span></div>
      <div class="task-card" onclick="location.href='../writing/write-an-email/index.html'">
        <div class="task-icon"><i class="ti ti-mail" aria-hidden="true"></i></div>
        <div class="task-info">
          <div class="task-name">
            <span data-i18n="write_an_email">Write an Email</span>
            <span class="task-badge"><i class="ti ti-sparkles" aria-hidden="true"></i><span data-i18n="ai_feedback">AI Feedback</span></span>
          </div>
          <div class="task-count" data-i18n="wae_short">1 prompt</div>
        </div>
        <div class="task-time"><span class="num">7</span><span class="unit" data-i18n="unit_min">min</span></div>
      </div>
    </div>

    <div class="task-row">
      <div class="task-rail" aria-hidden="true"><span class="line line-top"></span><span class="task-step">3</span><span class="line line-bot"></span></div>
      <div class="task-card" onclick="location.href='../writing/academic-discussion/index.html'">
        <div class="task-icon"><i class="ti ti-messages" aria-hidden="true"></i></div>
        <div class="task-info">
          <div class="task-name">
            <span data-i18n="academic_discussion">Academic Discussion</span>
            <span class="task-badge"><i class="ti ti-sparkles" aria-hidden="true"></i><span data-i18n="ai_feedback">AI Feedback</span></span>
          </div>
          <div class="task-count" data-i18n="ad_short">1 prompt</div>
        </div>
        <div class="task-time"><span class="num">10</span><span class="unit" data-i18n="unit_min">min</span></div>
      </div>
    </div>

  </div>

  <div class="info-strip" style="margin-top:1.25rem">
    <i class="ti ti-key" aria-hidden="true"></i>
    <span data-i18n="writing_api_short">AI feedback needs an Anthropic API key. Stored locally, never shared.</span>
  </div>
</div>
<script src="../lang/translations.js"></script>
<script src="../lang/i18n.js"></script>
</body>
</html>
