<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Reading — TOEFL</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
</head>
<body class="section-reading">
<div class="hero hero-filled">
  <div class="app-wide">
    <a href="../sections.html" class="back-btn" data-i18n="back_home">← Home</a>
    <div class="hero-top">
      <div class="hero-icon"><i class="ti ti-book" aria-hidden="true"></i></div>
      <h1 data-i18n="reading_section">Reading Section</h1>
    </div>
    <div class="hero-pills">
      <span class="hero-pill"><i class="ti ti-list-check" aria-hidden="true"></i>3 <span data-i18n="task_types">task types</span></span>
      <span class="hero-pill solid"><i class="ti ti-clock" aria-hidden="true"></i>~30 <span data-i18n="unit_min">min</span></span>
    </div>
  </div>
  <i class="ti ti-book hero-watermark" aria-hidden="true"></i>
</div>
<div class="app-wide">
  <div class="task-flow">

    <div class="task-row">
      <div class="task-rail" aria-hidden="true"><span class="line line-top"></span><span class="task-step">1</span><span class="line line-bot"></span></div>
      <div class="task-card" onclick="location.href='../reading/complete-the-words/index.html'">
        <div class="task-icon"><i class="ti ti-abc" aria-hidden="true"></i></div>
        <div class="task-info">
          <div class="task-name" data-i18n="complete_the_words">Complete the Words</div>
          <div class="task-count" data-i18n="ctw_short">10 paragraphs</div>
        </div>
        <div class="task-time"><span class="num">5</span><span class="unit" data-i18n="unit_min">min</span></div>
      </div>
    </div>

    <div class="task-row">
      <div class="task-rail" aria-hidden="true"><span class="line line-top"></span><span class="task-step">2</span><span class="line line-bot"></span></div>
      <div class="task-card" onclick="location.href='../reading/daily-life/index.html'">
        <div class="task-icon"><i class="ti ti-mail" aria-hidden="true"></i></div>
        <div class="task-info">
          <div class="task-name" data-i18n="read_in_daily_life">Read in Daily Life</div>
          <div class="task-count" data-i18n="rdl_short">8 passages</div>
        </div>
        <div class="task-time"><span class="num">10</span><span class="unit" data-i18n="unit_min">min</span></div>
      </div>
    </div>

    <div class="task-row">
      <div class="task-rail" aria-hidden="true"><span class="line line-top"></span><span class="task-step">3</span><span class="line line-bot"></span></div>
      <div class="task-card" onclick="location.href='../reading/academic-passage/index.html'">
        <div class="task-icon"><i class="ti ti-school" aria-hidden="true"></i></div>
        <div class="task-info">
          <div class="task-name" data-i18n="read_academic_passage">Read an Academic Passage</div>
          <div class="task-count" data-i18n="rap_short">5 passages</div>
        </div>
        <div class="task-time"><span class="num">15</span><span class="unit" data-i18n="unit_min">min</span></div>
      </div>
    </div>

  </div>
</div>
<script src="../lang/translations.js"></script>
<script src="../lang/i18n.js"></script>
</body>
</html>
