<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Listening — TOEFL</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
</head>
<body class="section-listening">
<div class="hero hero-filled">
  <div class="app-wide">
    <a href="../sections.html" class="back-btn" data-i18n="back_home">← Home</a>
    <div class="hero-top">
      <div class="hero-icon"><i class="ti ti-headphones" aria-hidden="true"></i></div>
      <h1 data-i18n="listening_section">Listening Section</h1>
    </div>
    <div class="hero-pills">
      <span class="hero-pill"><i class="ti ti-list-check" aria-hidden="true"></i>3 <span data-i18n="task_types">task types</span></span>
      <span class="hero-pill solid"><i class="ti ti-clock" aria-hidden="true"></i>~27 <span data-i18n="unit_min">min</span></span>
    </div>
  </div>
  <i class="ti ti-headphones hero-watermark" aria-hidden="true"></i>
</div>
<div class="app-wide">
  <div class="task-flow">

    <div class="task-row">
      <div class="task-rail" aria-hidden="true"><span class="line line-top"></span><span class="task-step">1</span><span class="line line-bot"></span></div>
      <div class="task-card" onclick="location.href='../listening/choose-a-response/index.html'">
        <div class="task-icon"><i class="ti ti-message-2" aria-hidden="true"></i></div>
        <div class="task-info">
          <div class="task-name" data-i18n="choose_a_response">Choose a Response</div>
          <div class="task-count" data-i18n="car_short">10 questions</div>
        </div>
        <div class="task-time"><span class="num">5</span><span class="unit" data-i18n="unit_min">min</span></div>
      </div>
    </div>

    <div class="task-row">
      <div class="task-rail" aria-hidden="true"><span class="line line-top"></span><span class="task-step">2</span><span class="line line-bot"></span></div>
      <div class="task-card" onclick="location.href='../listening/conversation/index.html'">
        <div class="task-icon"><i class="ti ti-users" aria-hidden="true"></i></div>
        <div class="task-info">
          <div class="task-name" data-i18n="conversation">Conversation</div>
          <div class="task-count" data-i18n="conv_short">3 conversations</div>
        </div>
        <div class="task-time"><span class="num">10</span><span class="unit" data-i18n="unit_min">min</span></div>
      </div>
    </div>

    <div class="task-row">
      <div class="task-rail" aria-hidden="true"><span class="line line-top"></span><span class="task-step">3</span><span class="line line-bot"></span></div>
      <div class="task-card" onclick="location.href='../listening/academic-talk/index.html'">
        <div class="task-icon"><i class="ti ti-speakerphone" aria-hidden="true"></i></div>
        <div class="task-info">
          <div class="task-name" data-i18n="academic_talk">Academic Talk</div>
          <div class="task-count" data-i18n="at_short">3 talks</div>
        </div>
        <div class="task-time"><span class="num">12</span><span class="unit" data-i18n="unit_min">min</span></div>
      </div>
    </div>

  </div>

  <div class="info-strip" style="margin-top:1.25rem">
    <i class="ti ti-headphones" aria-hidden="true"></i>
    <span data-i18n="listening_info_short">Choose a Response has audio. The other two use transcripts — click “Show Transcript”.</span>
  </div>
</div>
<script src="../lang/translations.js"></script>
<script src="../lang/i18n.js"></script>
</body>
</html>
