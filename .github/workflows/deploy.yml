# Pages cannot run a build when its source is a branch, so the site is built
# here and the finished dist/ is what gets published.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # So a deploy can be re-run without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs tsc -b first, so a type error stops the deploy.
      # VITE_SIGNALING_URL points the unlisted video test page at its WebSocket
      # server. Set it as a repository variable named SIGNALING_URL; if it is
      # empty the page just reports that it isn't configured.
      - run: npm run build
        env:
          VITE_SIGNALING_URL: ${{ vars.SIGNALING_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
