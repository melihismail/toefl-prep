<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Birlikte İngilizce — TOEFL Prep</title>
  <script>
    // GitHub Pages serves this for unknown paths. The React routes (/sections,
    // /sections/reading, ...) are not real files, so hand the path to index.html
    // and let the router take it from there.
    sessionStorage.setItem('spa-redirect', location.pathname + location.search + location.hash);
    location.replace('/');
  </script>
</head>
<body></body>
</html>
