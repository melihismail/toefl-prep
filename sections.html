<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOEFL Prep</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    .sections-header { background: rgba(255,255,255,.5); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.5); border-radius: 16px; padding: 1.5rem 1.75rem; margin-bottom: 1.25rem; }
    .sections-header h1 { font-size: 26px; font-weight: 800; color: var(--text); line-height: 1.25; letter-spacing: -.01em; }

    .sec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media(max-width:540px){ .sec-grid { grid-template-columns: 1fr; } }

    .sec-card { background: rgba(255,255,255,.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.5); border-radius: 16px; padding: 2.25rem 1.5rem; cursor: pointer; transition: transform .2s, box-shadow .2s, background .2s, border-color .2s; text-decoration: none; color: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; min-height: 180px; }
    .sec-card:hover { background: rgba(255,255,255,.78); border-color: var(--accent-mid); transform: translateY(-3px); box-shadow: 0 8px 28px rgba(124,58,237,.13); }
    .sec-card:focus-visible { outline: 2px solid #7c3aed; outline-offset: 3px; }

    .sec-icon { width: 60px; height: 60px; border-radius: 18px; display: flex; align-items: center; justify-content: center; transition: transform .2s; }
    .sec-icon i { font-size: 30px; }
    .sec-card:hover .sec-icon { transform: scale(1.06); }

    .sec-card .title { font-size: 19px; font-weight: 700; color: var(--text); letter-spacing: -.01em; }

    .sec-back { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #7c3aed; margin-bottom: 1.5rem; transition: color .15s; }
    .sec-back:hover { color: #4338ca; }
    .sec-back i { font-size: 18px; }

    @media (prefers-reduced-motion: reduce) {
      .sec-card, .sec-icon { transition: none; }
      .sec-card:hover { transform: none; }
      .sec-card:hover .sec-icon { transform: none; }
    }

    .lang-toggle { display: none !important; }
  </style>
</head>
<body>

<div class="app-wide" style="padding-top: 2rem;">

  <a href="index.html" class="sec-back" data-i18n="back_home">← Home</a>

  <div class="sections-header">
    <h1 data-i18n="practice_by_section">Practice by section</h1>
  </div>

  <div class="sec-grid">

    <a class="sec-card" href="pages/reading.html">
      <div class="sec-icon" style="background:rgba(238,242,255,.7)">
        <i class="ti ti-book" style="color:#4f46e5" aria-hidden="true"></i>
      </div>
      <div class="title" data-i18n="reading">Reading</div>
    </a>

    <a class="sec-card" href="pages/writing.html">
      <div class="sec-icon" style="background:rgba(254,249,236,.7)">
        <i class="ti ti-pencil" style="color:#d97706" aria-hidden="true"></i>
      </div>
      <div class="title" data-i18n="writing">Writing</div>
    </a>

    <a class="sec-card" href="pages/listening.html">
      <div class="sec-icon" style="background:rgba(236,253,245,.7)">
        <i class="ti ti-headphones" style="color:#059669" aria-hidden="true"></i>
      </div>
      <div class="title" data-i18n="listening">Listening</div>
    </a>

    <a class="sec-card" href="pages/speaking.html">
      <div class="sec-icon" style="background:rgba(253,244,255,.7)">
        <i class="ti ti-microphone" style="color:#9333ea" aria-hidden="true"></i>
      </div>
      <div class="title" data-i18n="speaking">Speaking</div>
    </a>

  </div>

</div>

<script src="lang/translations.js"></script>
<script src="lang/i18n.js"></script>
</body>
</html>
