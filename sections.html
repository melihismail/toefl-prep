<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOEFL Prep</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    .sections-header { background: rgba(255,255,255,.5); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.5); border-radius: 16px; padding: 1.5rem 1.75rem; margin-bottom: 1.25rem; }
    .sections-header h1 { font-size: 26px; font-weight: 800; color: var(--text); line-height: 1.25; letter-spacing: -.01em; }

    .sec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media(max-width:540px){ .sec-grid { grid-template-columns: 1fr; } }

    /* Each card is filled with its own section colour; the watermark carries
       the identity now that the icon tiles are gone. */
    .sec-card { position: relative; overflow: hidden; background: var(--sec); border: none; border-radius: 16px; padding: 1.5rem; cursor: pointer; transition: transform .2s, box-shadow .2s, background .2s; text-decoration: none; display: flex; align-items: flex-end; min-height: 150px; }
    .sec-card:hover { background: var(--sec-dark); transform: translateY(-3px); box-shadow: 0 10px 28px var(--sec-glow); }
    .sec-card:focus-visible { outline: 2px solid var(--sec-dark); outline-offset: 3px; }

    .sec-watermark { position: absolute; right: -14px; top: 50%; transform: translateY(-50%); font-size: 108px; line-height: 1; color: #fff; opacity: .14; pointer-events: none; transition: transform .25s, opacity .25s; }
    .sec-card:hover .sec-watermark { transform: translateY(-50%) scale(1.06); opacity: .18; }

    .sec-card .title { position: relative; font-size: 21px; font-weight: 700; color: #fff; letter-spacing: -.015em; line-height: 1.2; }

    /* Cards fade in one after another on load, matching the section pages. */
    @keyframes sec-card-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    /* backwards, not both: a forwards fill would pin transform:none and kill the hover lift. */
    .sec-card { animation: sec-card-in .26s cubic-bezier(.22,.61,.36,1) backwards; }
    .sec-card:nth-child(1) { animation-delay: .02s; }
    .sec-card:nth-child(2) { animation-delay: .09s; }
    .sec-card:nth-child(3) { animation-delay: .16s; }
    .sec-card:nth-child(4) { animation-delay: .23s; }

    .sec-card.reading   { --sec:#4f46e5; --sec-dark:#4338ca; --sec-glow:rgba(79,70,229,.28); }
    .sec-card.writing   { --sec:#b45309; --sec-dark:#92400e; --sec-glow:rgba(180,83,9,.28); }
    .sec-card.listening { --sec:#059669; --sec-dark:#047857; --sec-glow:rgba(5,150,105,.28); }
    .sec-card.speaking  { --sec:#9333ea; --sec-dark:#7e22ce; --sec-glow:rgba(147,51,234,.28); }

    .sec-back { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #7c3aed; margin-bottom: 1.5rem; transition: color .15s; }
    .sec-back:hover { color: #4338ca; }
    .sec-back i { font-size: 18px; }

    @media (prefers-reduced-motion: reduce) {
      .sec-card, .sec-watermark { transition: none; }
      .sec-card { animation: none; }
      .sec-card:hover { transform: none; }
      .sec-card:hover .sec-watermark { transform: translateY(-50%); }
    }

    .lang-toggle { display: none !important; }
  </style>
</head>
<body>

<div class="app-wide" style="padding-top: 2rem;">

  <a href="index.html" class="sec-back" data-i18n="back_home">← Home</a>

  <div class="sections-header">
    <h1 data-i18n="practice_by_section">Practice by section</h1>
  </div>

  <div class="sec-grid">

    <a class="sec-card reading" href="pages/reading.html">
      <i class="ti ti-book sec-watermark" aria-hidden="true"></i>
      <div class="title" data-i18n="reading">Reading</div>
    </a>

    <a class="sec-card writing" href="pages/writing.html">
      <i class="ti ti-pencil sec-watermark" aria-hidden="true"></i>
      <div class="title" data-i18n="writing">Writing</div>
    </a>

    <a class="sec-card listening" href="pages/listening.html">
      <i class="ti ti-headphones sec-watermark" aria-hidden="true"></i>
      <div class="title" data-i18n="listening">Listening</div>
    </a>

    <a class="sec-card speaking" href="pages/speaking.html">
      <i class="ti ti-microphone sec-watermark" aria-hidden="true"></i>
      <div class="title" data-i18n="speaking">Speaking</div>
    </a>

  </div>

</div>

<script src="lang/translations.js"></script>
<script src="lang/i18n.js"></script>
</body>
</html>
